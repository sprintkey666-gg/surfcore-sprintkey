<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>SurfCore 悬浮窗</title>
  <link rel="stylesheet" href="orb.css" />
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="root" class="collapsed">
    <!-- 桌宠（dsh-pet 素材）：双 video 交叉淡入，避免动作切换时黑一下 -->
    <div id="pet" class="pet hidden">
      <div class="petStage">
        <video class="pv" id="pvA" muted playsinline preload="auto"></video>
        <video class="pv" id="pvB" muted playsinline preload="auto"></video>
      </div>
      <div id="bubble" class="bubble hidden"><img id="bubblePic" class="bubblePic hidden" alt=""><span id="bubbleText"></span></div>
    </div>

    <!-- 右键菜单：画在窗口内部，绝不改窗口尺寸（主人要求「界面大小刚好」） -->
    <div id="ctxmenu" class="ctxmenu hidden" role="menu">
      <button class="ctxitem" id="ctxOpen" data-act="open">打开会话</button>
      <button class="ctxitem" id="ctxAction" data-act="action">换个动作</button>
      <button class="ctxitem" id="ctxSizeToggle" data-act="size">大小<span class="ctxchev">›</span></button>
      <div id="ctxSize" class="ctxsize hidden">
        <input id="ctxSizeRange" class="szrange" type="range" min="0" max="100" step="1" value="40" />
        <b id="ctxSizeValue" class="szvalue">40%</b>
      </div>
      <button class="ctxitem" id="ctxHide" data-act="hide">隐藏到托盘</button>
      <!-- 陪伴：直接放在菜单里，不藏二级面板 -->
      <div id="ctxCompanionPanel" class="ctxcompanion">
        <button class="ctxitem sub" id="ctxCompToggle" type="button">开启陪伴</button>
        <label class="ctxcheck"><input id="ctxCompContext" type="checkbox" /> 上下文字幕</label>
      </div>
    </div>

    <!-- 小球（素材没装时的后备形象） -->
    <div id="ball" title="点一下展开；中键滚轮调大小；拖动换位置">
      <div id="ballAvatar" class="avatar"></div>
      <i id="badge" class="badge hidden"></i>
    </div>

    <!-- 展开后的面板 -->
    <div id="panel" class="panel">
      <header class="head">
        <span class="dot" id="connDot" title="连接状态"></span>
        <span class="name" id="roleName">她</span>
        <span class="spacer"></span>
        <button class="mini eye" id="btnEye" title="让她看一眼你的屏幕（看完就删）">眼</button>
        <button class="mini move" id="btnMove" title="点亮后按住面板任意空白处拖动">移</button>
        <button class="mini pic hidden" id="btnPic" title="发一张图/表情包（优先 QQ 表情，其次本地图库，最后现场生图）">图</button>
        <button class="mini pin" id="btnPin" title="固定在这里（鼠标离开也不收起）">钉</button>
        <button class="mini" id="btnNew" title="开一个新对话">新对话</button>
        <button class="mini" id="btnHide" title="收起">收起</button>
      </header>
      <!-- 眼睛开着时的一行提醒（她真的在看的时候才出现） -->
      <div class="screenhint hidden" id="screenHint">
        <span id="screenHintText">她正看着你的屏幕 · 看完就删</span>
      </div>
      <main class="bubbles" id="bubbles">
        <div class="empty" id="empty">还没有对话。说句话吧。</div>
      </main>
      <!-- 主人往上翻历史时来了新消息：圆形里是条数；没有未读就显示向下箭头 -->
      <button class="jump hidden" id="btnJump" title="有新消息，点一下跳到最新">↓</button>
      <footer class="composer">
        <div id="composerAttachments" class="attachments hidden" aria-label="待发附件"></div>
        <div class="composer-row">
          <button id="btnAttach" class="attach" type="button" title="添加图片或文件（也可以直接粘贴/拖进来）" aria-label="添加图片或文件">+</button>
          <input id="input" type="text" placeholder="和她说点什么…" maxlength="2000" />
          <button id="btnSend" class="send">发</button>
        </div>
      </footer>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <!-- 看图查看器：双击会话里的图打开，滚轮以鼠标位置为中心缩放、按住左键拖动 -->
  <div id="viewer" class="viewer hidden">
    <img id="viewerImg" alt="" />
    <button id="viewerClose" class="viewer-close" title="关闭（Esc）">×</button>
    <div class="viewer-tip">滚轮缩放 · 按住左键拖动 · Esc 关闭</div>
  </div>
  <script src="pet.js"></script>
  <script src="orb.js"></script>
</body>
</html>
